<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tradezone AI Assistant</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a0a2e 50%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .widget-container {
      background: linear-gradient(145deg, #1a1a1a 0%, #2d1b69 100%);
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(139, 92, 246, 0.2);
      display: flex; /* Make it a flex container */
      flex-direction: column; /* Stack children vertically */
      height: 550px; /* Fixed height for the widget */
      max-height: 90vh; /* Max height relative to viewport */
    }

    .welcome-view, .chat-view {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 0; /* Important for flex items with overflow */
    }

    .welcome-view {
      /* Initially visible */
      display: flex; 
      padding: 32px 24px 24px;
      text-align: center;
    }

    .chat-view {
      /* Initially hidden */
      display: none; 
      padding: 0 24px 24px;
    }

    .welcome-title {
      font-family: 'Darker Grotesque', sans-serif;
      font-size: 3rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(139, 92, 246, 0.3);
    }

    .video-container {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      background: #f5f5f5;
    }

    .avatar-video {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .video-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .video-overlay:hover {
      background: rgba(255, 255, 255, 1);
      transform: translate(-50%, -50%) scale(1.1);
    }

    .play-icon {
      width: 0;
      height: 0;
      border-left: 20px solid #6366f1;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      margin-left: 4px;
    }

    .talk-button {
      background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 100%);
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      font-family: 'Open Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.4);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .talk-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px rgba(124, 58, 237, 0.6);
      background: linear-gradient(135deg, #5b21b6 0%, #8b5cf6 100%);
    }

    .talk-button:active {
      transform: translateY(0);
    }

    .chat-messages {
      flex-grow: 1; /* Allow messages to take up available space */
      overflow-y: auto; /* Keep scrolling for messages */
      margin-bottom: 16px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 16px;
      display: flex; /* Always flex for messages */
      flex-direction: column;
      border: 1px solid rgba(139, 92, 246, 0.2);
    }

    .message {
      margin-bottom: 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 14px;
      font-weight: 600;
      flex-shrink: 0;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .message.user .message-avatar {
      background: linear-gradient(135deg, #1f2937 0%, #374151 100%);
    }

    .message-content {
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 18px;
      max-width: 80%;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      font-size: 14px;
      line-height: 1.5;
      color: #ffffff;
      border: 1px solid rgba(139, 92, 246, 0.2);
      text-align: left; /* Ensure text aligns left within the bubble */
      white-space: pre-wrap; /* Preserve whitespace and wrap text */
    }

    /* Markdown specific styles */
    .message-content p {
      margin-bottom: 0.5em; /* Space between paragraphs */
    }
    .message-content p:last-child {
      margin-bottom: 0;
    }
    .message-content ul, .message-content ol {
      margin-left: 1.5em;
      margin-bottom: 0.5em;
      padding: 0;
      list-style-type: disc; /* Ensure list bullets/numbers are visible */
      color: #ffffff; /* Ensure list items are visible */
    }
    .message-content ol {
      list-style-type: decimal;
    }
    .message-content li {
      margin-bottom: 0.25em;
    }
    .message-content a {
      color: #8b5cf6; /* Purple color for links */
      text-decoration: underline;
      word-break: break-all; /* Break long links */
      cursor: pointer; /* Indicate clickable link */
    }
    .message-content a:hover {
      text-decoration: none;
    }
    .message-content strong {
      font-weight: 700;
    }
    .message-content em {
      font-style: italic;
    }
    .message-content code {
      background-color: rgba(139, 92, 246, 0.2);
      border-radius: 4px;
      padding: 0.2em 0.4em;
      font-family: 'monospace', monospace;
      font-size: 0.9em;
    }
    .message-content pre {
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      padding: 1em;
      overflow-x: auto;
      font-family: 'monospace', monospace;
      font-size: 0.9em;
      line-height: 1.4;
      margin-top: 0.5em;
      margin-bottom: 0.5em;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 100%);
      color: white;
    }

    .input-container {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-shrink: 0; /* Prevent input from shrinking */
      margin-top: auto; /* Push input to bottom if chat messages are short */
    }

    .message-input {
      flex: 1;
      border: 2px solid rgba(139, 92, 246, 0.3);
      border-radius: 20px;
      padding: 12px 16px;
      font-size: 14px;
      font-family: 'Open Sans', sans-serif;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      transition: border-color 0.3s ease;
      background: rgba(0, 0, 0, 0.3);
      color: #ffffff;
    }

    .message-input:focus {
      outline: none;
      border-color: #8b5cf6;
      background: rgba(0, 0, 0, 0.4);
    }

    .message-input::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .send-button {
      background: linear-gradient(135deg, #4c1d95 0%, #7c3aed 100%);
      border: none;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      flex-shrink: 0;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .send-button:hover {
      transform: scale(1.1);
    }

    .send-icon {
      width: 20px;
      height: 20px;
      fill: white;
    }

    .thinking-indicator {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: rgba(139, 92, 246, 0.1);
      border-radius: 12px;
      margin-bottom: 16px;
      font-size: 14px;
      color: #8b5cf6;
      border: 1px solid rgba(139, 92, 246, 0.2);
    }

    .thinking-indicator.active {
      display: flex;
    }

    .thinking-dots {
      display: flex;
      gap: 4px;
    }

    .thinking-dot {
      width: 6px;
      height: 6px;
      background: #8b5cf6;
      border-radius: 50%;
      animation: thinking 1.4s infinite ease-in-out;
    }

    .thinking-dot:nth-child(1) { animation-delay: -0.32s; }
    .thinking-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes thinking {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .widget-container {
        margin: 10px;
        max-width: none;
      }
      
      .welcome-title {
        font-size: 2.5rem;
      }
      
      .welcome-view {
        padding: 24px 20px 20px;
      }
      
      .chat-view {
        padding: 0 20px 20px;
      }
    }

    /* Custom scrollbar */
    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <!-- Welcome View -->
    <div class="welcome-view" id="welcomeView">
      <h1 class="welcome-title">Welcome!</h1>
      
      <!-- Video Section -->
      <div class="video-container">
        <video 
          class="avatar-video" 
          src="https://videostream44.b-cdn.net/tradezone-welcome-avatar-2.mp4" 
          muted 
          loop
          preload="metadata"
        ></video>
        <div class="video-overlay" id="playButton">
          <div class="play-icon"></div>
        </div>
      </div>
      
      <!-- Talk Button -->
      <button class="talk-button" id="talkButton">Talk</button>
    </div>

    <!-- Chat View -->
    <div class="chat-view" id="chatView">
      <!-- Thinking Indicator -->
      <div class="thinking-indicator" id="thinkingIndicator">
        <span>AI is thinking</span>
        <div class="thinking-dots">
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
          <div class="thinking-dot"></div>
        </div>
      </div>

      <!-- Chat Messages -->
      <div class="chat-messages" id="chatMessages"></div>

      <!-- Input Container -->
      <div class="input-container">
        <textarea 
          class="message-input" 
          id="messageInput" 
          placeholder="Type a message..."
          rows="1"
        ></textarea>
        <button class="send-button" id="sendButton">
          <svg class="send-icon" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ElevenLabs Voice Widget -->
  <elevenlabs-convai agent-id="agent_01jzzev7k9e6d9dqsj507s9yz2"></elevenlabs-convai>
  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

  <!-- Markdown Parser Library -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Main JavaScript -->
  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    class TradezoneWidget {
      constructor() {
        this.initializeElements();
        this.setupUserId();
        this.initializeChat();
        this.bindEvents();
        this.isChatActive = false; // Track if chat is active
        
        // Add the initial welcome message from Izacc immediately when the widget is constructed
        this.addMessage('Hi! I’m Izacc from TradeZone. How can I help you today?', false);
      }

      initializeElements() {
        this.playButton = document.getElementById('playButton');
        this.video = document.querySelector('.avatar-video');
        this.talkButton = document.getElementById('talkButton');
        this.messageInput = document.getElementById('messageInput');
        this.sendButton = document.getElementById('sendButton');
        this.chatMessages = document.getElementById('chatMessages');
        this.thinkingIndicator = document.getElementById('thinkingIndicator');
        this.welcomeView = document.getElementById('welcomeView');
        this.chatView = document.getElementById('chatView');
      }

      setupUserId() {
        this.userId = localStorage.getItem('tradezone-user-id');
        if (!this.userId) {
          this.userId = 'user-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
          localStorage.setItem('tradezone-user-id', this.userId);
        }
      }

      initializeChat() {
        try {
          this.chatInstance = createChat({
            webhookUrl: 'https://n8.getrezult.com/webhook/cf424bcc-ac90-4fd8-80b9-7292f8d61a6d/chat',
            target: '#hidden-chat-container', // Render to a hidden container
            mode: 'window',
            metadata: { 
              userId: this.userId,
              source: 'tradezone-widget'
            },
            allowFileUploads: false,
            loadPreviousSession: true,
            initialMessages: []
          });
          console.log('n8n chat library initialized for session management:', this.chatInstance);

          // Check if there's a previous session with messages and show chat if so
          this.chatInstance.onSessionLoaded = (session) => {
            if (session && session.messages.length > 0) {
              console.log('Previous session loaded, showing chat area.');
              this.showChatArea();
              this.chatMessages.innerHTML = ''; // Clear existing messages (including the initial welcome message)
              session.messages.forEach(msg => {
                this.addMessage(msg.text, msg.type === 'user');
              });
            }
            // No else block here, as the initial message is now added in the constructor
          };

        } catch (error) {
          console.error('Failed to initialize n8n chat library:', error);
          // If chat initialization fails, we can still show the chat area with an error message
          // The initial message is already added in the constructor, so we just show the area
          this.showChatArea(); 
        }
      }

      bindEvents() {
        this.playButton.addEventListener('click', () => {
          this.playVideo();
        });

        this.talkButton.addEventListener('click', () => {
          this.showChatArea(); // Switch to the chat view
          this.activateVoiceChat();
        });

        this.sendButton.addEventListener('click', () => {
          this.sendMessage();
        });

        this.messageInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            this.sendMessage();
          }
        });

        this.messageInput.addEventListener('input', () => {
          this.autoResizeTextarea();
        });

        // Moved video event listeners here to be attached only once
        this.video.addEventListener('pause', () => {
          this.playButton.style.display = 'flex';
        });

        this.video.addEventListener('ended', () => {
          this.playButton.style.display = 'flex';
        });
      }

      async playVideo() {
        try {
          this.video.muted = false;
          await this.video.play();
          this.playButton.style.display = 'none';
        } catch (err) {
          console.error("Error playing video:", err);
          // If play fails, show the button again so the user can retry
          this.playButton.style.display = 'flex';
        }
      }

      activateVoiceChat() {
        const existingWidget = document.querySelector('elevenlabs-convai');
        if (existingWidget && existingWidget.style.display !== 'none') {
          return;
        }

        if (existingWidget) {
          existingWidget.style.display = 'block';
        }

        console.log('Voice chat activated');
      }

      async sendMessage() {
        const message = this.messageInput.value.trim();
        if (!message) return;

        if (!this.isChatActive) {
          this.showChatArea();
          this.isChatActive = true;
        }

        this.addMessage(message, true);

        this.messageInput.value = '';
        this.autoResizeTextarea();

        this.showThinking();

        await this.sendMessageDirect(message);
      }

      async sendMessageDirect(message) {
        try {
          console.log('sendMessageDirect called with message:', message);
          const requestBody = {
            action: 'sendMessage',
            sessionId: this.userId,
            chatInput: message,
            metadata: {
              userId: this.userId,
              source: 'tradezone-widget'
            }
          };
          console.log('Sending to webhook with body:', requestBody);

          const response = await fetch('https://n8.getrezult.com/webhook/cf424bcc-ac90-4fd8-80b9-7292f8d61a6d/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(requestBody)
          });

          console.log('Webhook response status:', response.status);
          if (!response.ok) {
            const errorText = await response.text();
            console.error('Webhook response error body:', errorText); // Log the error body
            throw new Error(`HTTP error! status: ${response.status}, body: ${errorText}`);
          }

          const data = await response.json();
          console.log('Direct webhook response (full data):', data);
          
          this.hideThinking();
          let responseText = '';

          if (data && typeof data.output === 'string') {
            responseText = data.output;
            console.log('Extracted message from "data.output" format:', responseText);
          } else if (data && typeof data.text === 'string') {
            responseText = data.text;
            console.log('Extracted message from "data.text" format:', responseText);
          } else if (data && data.response && typeof data.response.text === 'string') {
            responseText = data.response.text;
            console.log('Extracted message from "data.response.text" format:', responseText);
          } else {
            console.warn('Webhook response did not contain expected text content (output, text, or response.text):', data);
          }

          if (responseText) {
            this.addMessage(responseText, false);
            this.speakResponse(responseText);
          } else {
            this.addMessage('Sorry, I received an unexpected response from the server.', false);
          }

        } catch (error) {
          console.error('Direct chat error:', error);
          this.hideThinking();
          this.addMessage('Sorry, there was an error processing your message. Please try again.', false);
        }
      }

      speakResponse(text) {
        try {
          const elevenlabsWidget = document.querySelector('elevenlabs-convai');
          if (elevenlabsWidget) {
            const speechEvent = new CustomEvent('speak', {
              detail: { text: text }
            });
            elevenlabsWidget.dispatchEvent(speechEvent);
          }
        } catch (error) {
          console.error('Error triggering speech:', error);
        }
      }

      addMessage(text, isUser) {
        console.log(`Attempting to add message: "${text}" (isUser: ${isUser})`);
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = isUser ? 'U' : 'AI';

        const content = document.createElement('div');
        content.className = 'message-content';
        // Use marked.parse() to convert markdown to HTML
        content.innerHTML = marked.parse(text); 

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);

        this.chatMessages.appendChild(messageDiv);
        console.log('Message element appended to chatMessages container:', messageDiv);
        this.scrollToBottom();
      }

      showChatArea() {
        // Hide welcome view and show chat view
        if (this.welcomeView) {
          this.welcomeView.style.display = 'none';
          console.log('Welcome view hidden.');
        }
        if (this.chatView) {
          this.chatView.style.display = 'flex'; // Use flex to enable column layout
          console.log('Chat view made visible and set to flex.');
        }
        
        // Ensure chat messages container is active
        if (!this.chatMessages.classList.contains('active')) {
          this.chatMessages.classList.add('active');
          console.log('Chat messages container activated.');
        }
        this.scrollToBottom(); // Ensure scroll to bottom after showing
      }

      showThinking() {
        this.thinkingIndicator.classList.add('active');
      }

      hideThinking() {
        this.thinkingIndicator.classList.remove('active');
      }

      scrollToBottom() {
        this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
      }

      autoResizeTextarea() {
        this.messageInput.style.height = 'auto';
        this.messageInput.style.height = Math.min(this.messageInput.scrollHeight, 120) + 'px';
      }
    }

    // Initialize the widget when DOM is loaded
    document.addEventListener('DOMContentLoaded', () => {
      new TradezoneWidget();
    });
  </script>

  <!-- Hidden container for n8n chat (required but not visible) -->
  <div id="hidden-chat-container" style="display: none;"></div>
</body>
</html>
